# Push par Supabase deploy: database migrations + dono edge functions.
# GitHub repo → Settings → Secrets and variables → Actions mein 3 secrets chahiye:
#   SUPABASE_ACCESS_TOKEN  (supabase.com → account → Access Tokens → Generate)
#   SUPABASE_PROJECT_REF   (Project Settings → General → Project ID)
#   SUPABASE_DB_PASSWORD   (project banate waqt wala database password)
name: Deploy to Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} -p "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --remote --yes -p "$SUPABASE_DB_PASSWORD"
      - run: supabase functions deploy api --no-verify-jwt --yes --remote=${{ secrets.SUPABASE_PROJECT_REF }}
      - run: supabase functions deploy import --no-verify-jwt --yes --remote=${{ secrets.SUPABASE_PROJECT_REF }}
